# Every push to main: run CI, build the Docker image, push it to GitHub's container registry, release it on the
# Hetzner server over SSH. deploy.sh on the server migrates, switches, health-checks and rolls back on failure.
#
# Repository settings this needs (Settings → Secrets and variables → Actions):
#   secrets   DEPLOY_HOST         server IP or hostname
#             DEPLOY_SSH_KEY      private half of the deploy key (public half given to setup-server.sh)
#             DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <server IP>`, pins the server's identity
#   variables PUBLIC_URL          e.g. https://app.nepalshop.com (built into the app; must match the server .env)
#             BASE_DOMAIN         optional, e.g. nepalshop.com for <store>.nepalshop.com
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time; a newer push waits rather than cancelling one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build image
    needs: ci
    # Off until the server is set up: add the PUBLIC_URL repository variable (deploy/README.md, step 5) to turn releases on.
    if: vars.PUBLIC_URL != ''
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            PUBLIC_URL=${{ vars.PUBLIC_URL }}
            BASE_DOMAIN=${{ vars.BASE_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release on server
    needs: image
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment in GitHub to approve each release by hand.
    environment: production
    # Secrets reach the shell as environment variables, never pasted into the commands themselves.
    env:
      TARGET: deploy@${{ secrets.DEPLOY_HOST }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy server config
        run: scp deploy/compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh "$TARGET:/srv/nepalshop/"
      - name: Release
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # Short-lived registry login: this job's token can pull the image and expires when the job ends.
          printf '%s' "$REGISTRY_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin" >/dev/null
          ssh "$TARGET" "chmod +x /srv/nepalshop/*.sh && /srv/nepalshop/deploy.sh '$IMAGE'"
      - name: Registry logout
        if: always()
        run: ssh "$TARGET" "docker logout ghcr.io" >/dev/null || true
