# Checks every pull request and every branch push. The deploy workflow runs the same checks before releasing main.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web app and API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nepalshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nepalshop
      SESSION_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The build also generates the route tree the type check needs.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run migrate
      - run: bun test

  mobile:
    name: Seller mobile app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The app imports the API's types from the root project, so both need their dependencies.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bun run typecheck
        working-directory: apps/mobile

  deploy-config:
    name: Server config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts
        run: shellcheck --severity=warning deploy/*.sh
      - name: Compose file
        run: |
          touch deploy/.env
          APP_IMAGE=example POSTGRES_PASSWORD=example APP_DOMAIN=app.example.com ACME_EMAIL=ops@example.com \
            docker compose -f deploy/compose.yml config --quiet
      - name: Caddyfile
        run: |
          docker run --rm -e APP_DOMAIN=app.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
